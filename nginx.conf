##
## GS1 OCR — nginx site config
## setup-vm.sh installs this automatically.
## __APP_DIR__ is replaced with the real path during setup.
##

server {
    listen 80;
    server_name _;   # replace with your domain or VM IP if you want strict matching

    # ── React frontend (built static files) ──────────────────────────────
    root __APP_DIR__/frontend/dist;
    index index.html;

    # ── API → FastAPI backend ─────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    240s;   # OCR + Qwen can take several minutes on hard images
        proxy_connect_timeout  10s;
        proxy_send_timeout    420s;

        client_max_body_size 25M;
    }

    location /health {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Legacy multipart OCR routes (POST; must not fall through to SPA `location /`) ─
    location = /front {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    240s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    420s;
        client_max_body_size 25M;
    }
    location = /back {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    240s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    420s;
        client_max_body_size 25M;
    }
    location = /ingredients {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    240s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    420s;
        client_max_body_size 25M;
    }
    location = /nutritional {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    240s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    420s;
        client_max_body_size 25M;
    }

    # ── Redirect old doc paths (would hit SPA as /docs) → FastAPI under /api/ ─
    location = /docs {
        return 302 /api/docs;
    }
    location = /docs/ {
        return 302 /api/docs;
    }
    location = /redoc {
        return 302 /api/redoc;
    }
    location = /redoc/ {
        return 302 /api/redoc;
    }
    location = /openapi.json {
        return 302 /api/openapi.json;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml;
    gzip_min_length 1024;
}
