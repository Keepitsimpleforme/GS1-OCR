##
## GS1 OCR — nginx site config
## Install: sudo cp nginx.conf /etc/nginx/sites-available/ocr-project
##          sudo ln -sf /etc/nginx/sites-available/ocr-project /etc/nginx/sites-enabled/
##          sudo rm -f /etc/nginx/sites-enabled/default
##          sudo nginx -t && sudo systemctl reload nginx
##

server {
    listen 80;
    server_name _;          # replace with your domain or VM IP if desired

    # ── Static React build ────────────────────────────────────────────────
    root /opt/ocr-project/frontend/dist;
    index index.html;

    # ── API proxy → FastAPI backend ───────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # OCR can take up to 60 s; set generous timeouts
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;

        # Allow image uploads up to 25 MB
        client_max_body_size 25M;
    }

    location /health {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── SPA fallback (client-side routing) ───────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "same-origin"  always;

    # ── Gzip ─────────────────────────────────────────────────────────────
    gzip             on;
    gzip_types       text/plain text/css application/json application/javascript
                     text/javascript image/svg+xml;
    gzip_min_length  1024;
}
